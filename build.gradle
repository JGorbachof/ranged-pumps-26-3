plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge { version = '26.3.0.118'; mods { rangedpumps { sourceSet(sourceSets.main) } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

group = 'com.refinedmods'
version = '2.0.0-port.1'
base { archivesName = 'rangedpumps-26.3' }
tasks.processResources { from('src/main/templates') { expand(version: project.version) }; from('LICENSE.md'); from('NOTICE') }

neoForge { runs { gameTestServer { type = 'gameTestServer'; gameDirectory = file('run-gametest'); systemProperty 'neoforge.enabledGameTestNamespaces', 'rangedpumps' } } }
